[workspace]
members = [
    "crates/stark-engine",
    "crates/stark-engine-macros",
    "crates/stark-score",
    "crates/stark-generate",
]
resolver = "3"
exclude = ["vendor/cxx"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
version = "0.1.0"
authors = ["Mirai Tech Inc. <contact@getmirai.co>"]
homepage = "https://github.com/jshahbazi/stark"
repository = "https://github.com/jshahbazi/stark"
license = "MIT"

[workspace.dependencies]
stark-engine-macros = { path = "crates/stark-engine-macros" }
xgrammar = { package = "xgrammar-rs", git = "https://github.com/trymirai/xgrammar-rs.git", branch = "main", features = ["tokenizers"] }
cxx = { path = "vendor/cxx", version = "1.0.195" }
half = { version = "2.7", features = ["bytemuck", "num-traits"] }
ndarray = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
monostate = "0.1"
thiserror = "2.0"
tokenizers = { version = "0.22", features = [
    "fancy-regex",
], default-features = false }
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
obfstr = "0.4.4"
metal = { package = "mtl-rs", version = "0.2.2" }
bytemuck = "1.23"
xxhash-rust = "0.8.15"
num-traits = "0.2"
libc = "0.2"
libm = "0.2.16"
rand = "0.10"
rand_distr = "0.6.0"
itertools = "0.14"
schemars = { version = "1.2", features = ["derive", "preserve_order"] }
is_close = "0.1"
anyhow = "1.0.102"
rayon = "1.12.0"
derive_more = { version = "2", features = ["from", "deref", "as_ref", "display"] }
walkdir = "2.5"
depfile = "0.1"
tempfile = "3.24"
clang-ast = "0.1"
rangemap = "1.7.1"
parking_lot = "0.12"
blake3 = "1.8"
quote = "1.0"
proc-macro2 = "1.0"
syn = { version = "2.0", features = ["full", "fold", "visit-mut"] }
prettyplease = "0.2"
rhai = "1.24.0"
rstest = "0.26"
proptest = { version = "1.10", default-features = false, features = ["std"] }
criterion = { version = "0.8.2", default-features = false }
libtest-mimic = "0.8.2"
bitflags = "2.11.1"

[patch."https://github.com/trymirai/cxx.git"]
cxx = { path = "vendor/cxx" }
cxx-build = { path = "vendor/cxx/gen/build" }

[workspace.lints.clippy]
# TODO: add large_stack_frames, large_stack_arrays, trivially_copy_pass_by_ref, needless_pass_by_value, map_err_ignore, use_self, cloned_instead_of_copied, manual_let_else, semicolon_if_nothing_returned, uninlined_format_args, lossy_float_literal
module_inception = "allow"
type_complexity = "allow"
upper_case_acronyms = "allow"
large_enum_variant = "allow" # TODO: remove
enum_variant_names = "allow"
new_without_default = "allow"
too_many_arguments = "allow"
needless_range_loop = "allow" # TODO: remove
missing_safety_doc = "allow" # TODO: maybe remove?

[workspace.metadata.dinghy]
forward-cfgs = ["backend", "grammar"]

[workspace.metadata.dinghy.test-attribute-aliases]
stark_test = "dinghy_apple_runner_macros::test_case"
stark_bench = "dinghy_apple_runner_macros::bench_case"

[profile.dev]
opt-level = 1
overflow-checks = true

[profile.dev.package."*"]
opt-level = 2

[profile.dev.build-override]
opt-level = 2

[profile.release]
lto = "thin"

[profile.test]
opt-level = 2
overflow-checks = true
