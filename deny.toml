[advisories]
# Inspect the complete workspace, including inherited bindings and tools.
# Vulnerability exceptions require a separately reviewed scope, rationale and expiry.
# CI reports unmaintained packages as warnings, without ignoring their advisories.
ignore = []
unsound = "all"

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MPL-2.0",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "NCSA",
]

[bans]
multiple-versions = "allow"

[sources.allow-org]
github = ["trymirai"]
