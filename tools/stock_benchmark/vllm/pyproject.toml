[project]
name = "stark-stock-vllm-comparison"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "vllm @ https://github.com/vllm-project/vllm/releases/download/v0.32.0/vllm-0.32.0%2Bcpu-cp38-abi3-macosx_11_0_arm64.whl",
  "vllm-metal @ https://github.com/vllm-project/vllm-metal/releases/download/v0.32.0/vllm_metal-0.32.0-cp312-cp312-macosx_15_0_arm64.whl",
]

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
constraint-dependencies = ["certifi>=2026.10.19"]
# vLLM 0.32.0 pins setuptools 78.1.1, below the GHSA-h35f-9h28-mq5c fix.
# The benchmark uses prebuilt wheels; see ../README.md for the scoped override.
override-dependencies = ["setuptools==84.1.0"]
