[project]
name = "stark-convert"
version = "0.10.0"
description = "Independent streaming model conversion for the Stark engine"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.lalamo"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "huggingface-hub>=1.4.1",
    "numpy>=2.4.0",
    "ml-dtypes>=0.6.0",
    "psutil>=7.2.0",
    "tokenizers>=0.22.2",
]

[project.scripts]
stark-convert = "stark_convert.cli:main"
stark-convert-benchmark = "stark_convert.benchmark:main"

[dependency-groups]
dev = ["pytest>=9.0.3", "ruff>=0.15.0"]

[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["stark_convert*"]

[tool.setuptools.package-data]
stark_convert = ["catalog.json", "native_qualifications.json"]

[tool.uv]
python-preference = "only-managed"

[tool.ruff]
target-version = "py313"
line-length = 119

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
