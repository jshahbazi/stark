name: Signed release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        type: choice
        default: patch
        options:
          - major
          - minor
          - patch
      existing_version:
        description: Add a signed DMG to an existing stable release instead of creating a version (optional)
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: stark-signed-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  sign:
    name: Build, sign and notarize the distribution
    if: github.repository == 'jshahbazi/stark' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 90
    environment: macos-release
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.24'
          python-version: '3.13.13'
          enable-cache: false
      - name: Select pinned Python for the credential helper
        run: dirname "$(uv python find --managed-python 3.13.13)" >> "$GITHUB_PATH"
      - name: Select next distribution version on this protected source
        id: release
        env:
          VERSION_BUMP: ${{ inputs.bump }}
          EXISTING_VERSION: ${{ inputs.existing_version }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python scripts/release_version.py --bump "$VERSION_BUMP" --existing-version "$EXISTING_VERSION"
      - name: Set distribution version for subsequent steps
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: echo "STARK_RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
      - name: Check Metal tools and install pinned Rust
        if: inputs.existing_version == ''
        run: |
          set -euo pipefail
          xcodebuild -version
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun -sdk macosx metal --version
          rustup toolchain install 1.98.1 --profile minimal --no-self-update
      - name: Build the combined CLI and menu bar distribution
        if: inputs.existing_version == ''
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stark-input"
          uv run --no-project --python 3.13.13 python scripts/build_distribution.py \
            --version "$STARK_RELEASE_VERSION-unsigned" --output-dir "$RUNNER_TEMP/stark-input"
      - name: Download the immutable existing release
        if: inputs.existing_version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stark-input"
          gh release download "v$STARK_RELEASE_VERSION" --dir "$RUNNER_TEMP/stark-input" \
            --pattern "stark-$STARK_RELEASE_VERSION-aarch64-apple-darwin.tar.gz" \
            --pattern "stark-$STARK_RELEASE_VERSION-aarch64-apple-darwin.tar.gz.sha256"
          cd "$RUNNER_TEMP/stark-input"
          shasum -a 256 --check "stark-$STARK_RELEASE_VERSION-aarch64-apple-darwin.tar.gz.sha256"
      - name: Test the release tools before importing credentials
        run: |
          uv run --no-project --python 3.13.13 python -m unittest scripts/test_sign_distribution.py scripts/test_build_dmg.py scripts/test_apple_credentials.py scripts/test_release_version.py
      - name: Verify the new unsigned archive
        if: inputs.existing_version == ''
        run: |
          uv run --project tools/converter --locked --python 3.13.13 python scripts/verify_distribution.py \
            --archive "$RUNNER_TEMP/stark-input/stark-$STARK_RELEASE_VERSION-unsigned-aarch64-apple-darwin.tar.gz" \
            --version "$STARK_RELEASE_VERSION-unsigned" --expected-source "$GITHUB_SHA" --require-application \
            --output "$RUNNER_TEMP/stark-input/input-verification.json"
      - name: Import temporary Apple credentials
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: python .github/scripts/apple_credentials.py setup
      - name: Sign every native component and require Apple acceptance
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          EXISTING_VERSION: ${{ inputs.existing_version }}
          EXISTING_SOURCE: ${{ steps.release.outputs.source_revision }}
        run: |
          set -euo pipefail
          if [ -z "$EXISTING_VERSION" ]; then
            archive="$RUNNER_TEMP/stark-input/stark-$STARK_RELEASE_VERSION-unsigned-aarch64-apple-darwin.tar.gz"
            input_sha256=$(shasum -a 256 "$archive" | awk '{print $1}')
            uv run --no-project --python 3.13.13 python scripts/sign_distribution.py \
              --archive "$archive" \
              --input-sha256 "$input_sha256" --expected-source "$GITHUB_SHA" \
              --version "$STARK_RELEASE_VERSION" --sign-identity "$MACOS_SIGNING_IDENTITY" \
              --keychain "$RUNNER_TEMP/stark-signing/signing.keychain-db" --notary-profile stark-notary \
              --output-dir artifacts/signed-release
            archive="artifacts/signed-release/stark-$STARK_RELEASE_VERSION-aarch64-apple-darwin.tar.gz"
            source_revision="$GITHUB_SHA"
          else
            archive="$RUNNER_TEMP/stark-input/stark-$STARK_RELEASE_VERSION-aarch64-apple-darwin.tar.gz"
            source_revision="$EXISTING_SOURCE"
          fi
          input_sha256=$(shasum -a 256 "$archive" | awk '{print $1}')
          uv run --no-project --python 3.13.13 python scripts/build_dmg.py \
            --archive "$archive" --input-sha256 "$input_sha256" --expected-source "$source_revision" \
            --version "$STARK_RELEASE_VERSION" --sign-identity "$MACOS_SIGNING_IDENTITY" \
            --keychain "$RUNNER_TEMP/stark-signing/signing.keychain-db" --notary-profile stark-notary \
            --output-dir artifacts/signed-release
      - name: Remove temporary Apple credentials
        if: always()
        run: python .github/scripts/apple_credentials.py cleanup
      - name: Verify the disk image after credential cleanup
        env:
          EXISTING_SOURCE: ${{ steps.release.outputs.source_revision }}
        run: |
          set -euo pipefail
          source_revision="${EXISTING_SOURCE:-$GITHUB_SHA}"
          stem="artifacts/signed-release/stark-$STARK_RELEASE_VERSION-aarch64-apple-darwin"
          uv run --no-project --python 3.13.13 python scripts/build_dmg.py \
            --verify-dmg "$stem.dmg" --receipt "$stem.dmg.notarization.json" \
            --expected-signer EFE6CD2666B9106E68724C38ADD1C405267A2F94 \
            --expected-source "$source_revision" --version "$STARK_RELEASE_VERSION" \
            --output "$stem.dmg.verification.json"
      - name: Prepare the stable DMG download aliases
        if: inputs.existing_version == ''
        run: |
          set -euo pipefail
          stem="artifacts/signed-release/stark-$STARK_RELEASE_VERSION-aarch64-apple-darwin"
          cp -- "$stem.dmg" artifacts/signed-release/Stark.dmg
          digest=$(shasum -a 256 "$stem.dmg" | awk '{print $1}')
          printf '%s  %s\n' "$digest" Stark.dmg > artifacts/signed-release/Stark.dmg.sha256
          test "$(shasum -a 256 artifacts/signed-release/Stark.dmg | awk '{print $1}')" = "$digest"
      - name: Verify the signed installation after credential cleanup
        if: inputs.existing_version == ''
        run: |
          uv run --project tools/converter --locked --python 3.13.13 python scripts/verify_distribution.py \
            --archive "artifacts/signed-release/stark-$STARK_RELEASE_VERSION-aarch64-apple-darwin.tar.gz" \
            --version "$STARK_RELEASE_VERSION" --expected-source "$GITHUB_SHA" --require-application \
            --expected-distribution-source "$GITHUB_SHA" \
            --expected-signer EFE6CD2666B9106E68724C38ADD1C405267A2F94 --require-notarized \
            --output artifacts/signed-release/verification.json
          cp install.sh artifacts/signed-release/install.sh
      - name: Upload verified signed assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stark-signed-${{ github.sha }}
          path: artifacts/signed-release/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish the verified signed release
    needs: sign
    if: github.repository == 'jshahbazi/stark' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stark-signed-${{ github.sha }}
          path: artifacts/signed-release
      - name: Publish a new latest release without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STARK_RELEASE_VERSION: ${{ needs.sign.outputs.version }}
          EXISTING_VERSION: ${{ inputs.existing_version }}
        run: |
          set -euo pipefail
          tag="v$STARK_RELEASE_VERSION"
          if [ -n "$EXISTING_VERSION" ]; then
            echo 'The existing-release DMG is available in the signed workflow artifact. Verify it on a receiving Mac before adding it to the release.'
            exit 0
          fi
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo 'A release already exists for this version; assets are never replaced.' >&2
            exit 1
          fi
          cd artifacts/signed-release
          stem="stark-$STARK_RELEASE_VERSION-aarch64-apple-darwin"
          shasum -a 256 --check "$stem.tar.gz.sha256" "$stem.zip.sha256" "$stem.dmg.sha256"
          shasum -a 256 --check Stark.dmg.sha256
          cmp -- "$stem.dmg" Stark.dmg
          test "$(awk '{print $1}' "$stem.dmg.sha256")" = "$(awk '{print $1}' Stark.dmg.sha256)"
          printf '%s\n' \
            "Stark $STARK_RELEASE_VERSION for Apple silicon, macOS 26.4 or newer." \
            '' \
            'Includes terminal chat, the native menu bar app, generation/scoring workers and the converter with private Python runtimes. Native code is Developer ID signed with hardened runtime and secure timestamps. Apple accepted the distribution for notarization; the app ticket is stapled and validated.' \
            'Download the signed, notarized DMG for drag-and-drop application installation, or use the script below for the application and CLI tools.' \
            '' \
            '```sh' \
            "curl -fL https://github.com/$GH_REPO/releases/latest/download/install.sh -o stark-install.sh" \
            'sh stark-install.sh' \
            'export PATH="$HOME/.local/bin:$PATH"' \
            'stark doctor' \
            'open "$HOME/Applications/Stark.app"' \
            '```' \
            '' \
            'No Rust, Xcode, uv, or system Python setup is required. Models are separate.' \
            '' \
            'Built from the tagged source revision with locked dependencies. Source and signing-recipe revisions, archive hashes, Apple acceptance, and model-free installation checks are recorded in the attached JSON receipts.' \
            '' \
            'The app includes its notarization ticket. Standalone command-line executables use online tickets. The installer does not remove quarantine attributes or change Gatekeeper settings.' \
            > "$RUNNER_TEMP/signed-release-notes.md"
          # Create the immutable tag only after signing and verification succeed.
          # The API rejects an existing tag instead of moving it.
          gh api --method POST "repos/$GH_REPO/git/refs" \
            -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA" --silent
          gh release create "$tag" \
            "$stem.tar.gz" "$stem.tar.gz.sha256" "$stem.zip" "$stem.zip.sha256" \
            "$stem.dmg" "$stem.dmg.sha256" "$stem.dmg.notarization.json" "$stem.dmg.verification.json" \
            Stark.dmg Stark.dmg.sha256 \
            "$stem.notarization.json" verification.json install.sh \
            --repo "$GH_REPO" --verify-tag --latest --title "Stark $STARK_RELEASE_VERSION" \
            --notes-file "$RUNNER_TEMP/signed-release-notes.md"
