name: setup
description: Setup dependencies

inputs:
  linters:
    description: "Install linters"
    required: false
    default: 'false'
  metal:
    description: "Install metal toolchain"
    required: false
    default: 'false'
  test_data:
    description: "Download test data"
    required: false
    default: 'false'
  nextest:
    description: "Install nextest"
    required: false
    default: 'false'
  target:
    description: "Additional Rust target to install"
    required: false
    default: ''
  bindings:
    description: "Install bindings requirements"
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev build-essential pkg-config cmake
      shell: bash

    # - if: runner.os == 'Linux'
    #   run: |
    #     sudo mkdir -p /data/cargo
    #     sudo chown runner:runner /data/cargo

    #     mkdir -p ~/.cargo
    #     rm -rf ~/.cargo/registry && ln -sfn /data/cargo/registry ~/.cargo/registry
    #     rm -rf ~/.cargo/git && ln -sfn /data/cargo/git ~/.cargo/git
    #   shell: bash

    - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      with:
        targets: ${{ inputs.target }}

    - uses: dtolnay/rust-toolchain@f0d5300ba8908d942c808f4d31c08471d7798ba3 # nightly
      with:
        targets: ${{ inputs.target }}
        components: ${{ inputs.linters == 'true' && 'rustfmt,clippy' || '' }}

    # TODO: drop wasi when pure wasm is done and switch to latest
    - if: inputs.target == 'wasm32-wasip1-threads'
      uses: bytecodealliance/actions/wasmtime/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1
      with:
        version: "46.0.0"

    - if: inputs.linters == 'true'
      run: |
        arch -arm64 brew install clang-format cargo-deny
      shell: bash

    - if: inputs.metal == 'true'
      run: |
        arch -arm64 brew install cmake
        xcodebuild -downloadComponent MetalToolchain
      shell: bash

    - if: inputs.nextest == 'true'
      uses: taiki-e/install-action@b1351b86cd80d01fa50a500e2c3e435ce4e1dd60 # nextest

    - if: inputs.test_data == 'true' || inputs.bindings == 'true'
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      with:
        enable-cache: true

    - if: inputs.test_data == 'true'
      run: |
        cd ./tools/
        uv run export configs
        uv run export tokenizers
      shell: bash

    - if: inputs.bindings == 'true'
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: "20"
        registry-url: "https://registry.npmjs.org"

    - if: inputs.bindings == 'true'
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        version: 10.33.0
