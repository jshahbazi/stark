name: Rust build cache
description: Reuse locked Cargo dependencies and compatible native build outputs
inputs:
  scope:
    description: Job, profile and feature configuration namespace
    required: true
  metal:
    description: Include the installed Metal compiler in the cache identity
    default: 'false'
  restore-scopes:
    description: Additional compatible scopes to try when this scope has no cache, one per line
    default: ''
runs:
  using: composite
  steps:
    - name: Fingerprint Rust and native build inputs
      id: key
      shell: bash
      env:
        CACHE_SCOPE: ${{ inputs.scope }}
        CACHE_METAL: ${{ inputs.metal }}
        CACHE_RESTORE_SCOPES: ${{ inputs.restore-scopes }}
      run: |
        set -euo pipefail
        bash scripts/ci/rust-cache-key.sh "$CACHE_SCOPE" "$CACHE_METAL" >> "$GITHUB_OUTPUT"
        {
          echo 'fallback-restore-prefixes<<STARK_RESTORE_SCOPES'
          while IFS= read -r restore_scope || test -n "$restore_scope"; do
            test -n "$restore_scope" || continue
            bash scripts/ci/rust-cache-key.sh "$restore_scope" "$CACHE_METAL" \
              | sed -n 's/^restore-prefix=//p'
          done <<< "$CACHE_RESTORE_SCOPES"
          echo 'STARK_RESTORE_SCOPES'
        } >> "$GITHUB_OUTPUT"
    - name: Restore Rust build cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/registry/src
          ~/.cargo/git/db
          ~/.cargo/git/checkouts
          target
        key: ${{ steps.key.outputs.key }}
        restore-keys: |
          ${{ steps.key.outputs.restore-prefix }}
          ${{ steps.key.outputs.fallback-restore-prefixes }}
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
