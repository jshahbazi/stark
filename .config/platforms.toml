[envs]
MACOSX_DEPLOYMENT_TARGET = "26.4"
IPHONEOS_DEPLOYMENT_TARGET = "26.4"
XROS_DEPLOYMENT_TARGET = "26.4"
TVOS_DEPLOYMENT_TARGET = "26.4"
WATCHOS_DEPLOYMENT_TARGET = "26.4"

[tools]
# Please make sure to use compatible versions of the cargo-swift / uniffi pair.
# See: https://github.com/antoniusnaumann/cargo-swift?tab=readme-ov-file#installing-for-a-different-uniffi-version
swift = { provider = "cargo", version = "0.11.0" }
zigbuild = { provider = "cargo", version = "0.22.3" }
xwin = { provider = "cargo", version = "0.22.0" }
ziglang = { provider = "uv", version = "0.16.0" }
maturin = { provider = "uv", version = "1.13.1" }

[targets."aarch64-apple-darwin"]
backend = "metal"
aliases = ["apple", "macos"]
capabilities_supported = ["grammar"]
capabilities_default = ["grammar"]
required_envs = ["MACOSX_DEPLOYMENT_TARGET"]

[targets."x86_64-apple-darwin"]
backend = "cpu"
aliases = ["apple", "macos-intel"]
capabilities_supported = ["grammar"]
capabilities_default = ["grammar"]
required_envs = ["MACOSX_DEPLOYMENT_TARGET"]

[targets."aarch64-apple-ios"]
backend = "metal"
aliases = ["apple", "ios"]
capabilities_supported = ["grammar"]
capabilities_default = ["grammar"]
required_envs = ["IPHONEOS_DEPLOYMENT_TARGET"]

[targets."aarch64-apple-ios-sim"]
backend = "metal"
aliases = ["apple", "ios-sim", "ios-simulator"]
capabilities_supported = ["grammar"]
capabilities_default = ["grammar"]
required_envs = ["IPHONEOS_DEPLOYMENT_TARGET"]

[targets."aarch64-apple-ios-macabi"]
backend = "metal"
aliases = ["apple", "maccatalyst"]
capabilities_supported = ["grammar"]
capabilities_default = ["grammar"]
required_envs = ["IPHONEOS_DEPLOYMENT_TARGET"]

[targets."aarch64-unknown-linux-gnu"]
backend = "cpu"
aliases = ["linux"]
capabilities_supported = ["grammar"]
capabilities_default = ["grammar"]

[targets."x86_64-unknown-linux-gnu"]
backend = "cpu"
aliases = ["linux"]
capabilities_supported = ["grammar"]
capabilities_default = ["grammar"]

[targets."aarch64-pc-windows-msvc"]
backend = "cpu"
aliases = ["windows"]
capabilities_supported = ["grammar"]
capabilities_default = ["grammar"]

[targets."x86_64-pc-windows-msvc"]
backend = "cpu"
aliases = ["windows"]
capabilities_supported = ["grammar"]
capabilities_default = ["grammar"]

[targets."wasm32-wasip1-threads"]
backend = "cpu"
aliases = ["wasi"]
capabilities_supported = []
capabilities_default = []

[languages.rust]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-apple-ios",
    "aarch64-apple-ios-sim",
    "aarch64-apple-ios-macabi",
    "wasm32-wasip1-threads",
]
tools = ["ziglang", "zigbuild", "xwin"]
bindings = []
examples_path = "crates/legacy/stark/examples"
metadata = { image_url = "", badges = ["license"] }

[languages.python]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
tools = ["ziglang", "zigbuild", "xwin", "maturin"]
bindings = ["pyo3"]
examples_path = "crates/legacy/stark/bindings/python/examples"
metadata = { image_url = "", badges = ["license"] }

[languages.swift]
targets = [
    "aarch64-apple-darwin",
    "aarch64-apple-ios",
    "aarch64-apple-ios-sim",
    "aarch64-apple-ios-macabi",
]
tools = ["swift"]
bindings = ["uniffi"]
examples_path = "crates/legacy/stark/bindings/swift/Sources/Examples"
metadata = { image_url = "", badges = ["license"] }

[languages.typescript]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
tools = ["ziglang", "zigbuild", "xwin"]
bindings = ["napi"]
examples_path = "crates/legacy/stark/bindings/typescript/examples"
metadata = { image_url = "", badges = ["license"] }

[binaries.mirai]
crate = "cli"
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]

[badges]
license = '[![License](https://img.shields.io/badge/License-MIT-brightgreen)](LICENSE)'
python = '[![Python](https://img.shields.io/badge/Python-orange)](crates/legacy/stark/bindings/python)'
typescript = '[![TypeScript](https://img.shields.io/badge/TypeScript-yellow)](crates/legacy/stark/bindings/typescript)'
swift = '[![Swift](https://img.shields.io/badge/Swift-blue)](crates/legacy/stark/bindings/swift)'
swift_platforms = '[![Platforms](https://img.shields.io/badge/Platforms-iOS%20%7C%20macOS%20%7C%20Mac%20Catalyst-blue)](Package.swift)'
swift_version = '[![Swift](https://img.shields.io/badge/Swift-5.9-blue)](https://swift.org)'

[examples]
quick-start = { title = "Quick Start", description = "Minimal snippet that downloads a model and generates a single reply" }
chat = { title = "Chat", description = "In this example, we will download a model and get a reply to a specific list of messages:", explanation = "Once loaded, the same `ChatSession` can be reused for multiple requests until you drop it. Each model may consume a significant amount of RAM, so it's important to keep only one session loaded at a time. For iOS apps, we recommend adding the [Increased Memory Capability](https://developer.apple.com/documentation/bundleresources/entitlements/com.apple.developer.kernel.increased-memory-limit) entitlement to ensure your app can allocate the required memory." }
chat-cloud = { title = "Chat with the cloud model", description = "In this example, we will get a reply to a specific list of messages from a cloud model:" }
chat-shared-instance = { title = "Chat with shared instance", description = "This example shows how to reuse chat instance without reloading model into memory:" }
chat-structured-output = { title = "Chat with structured output", description = "Sometimes you want the generated output to be valid JSON with predefined fields. You can use `Grammar` to manually specify a JSON schema for the response you want to receive:" }
tool-calls = { title = "Tool calls", description = "This example shows how to use external tools:" }
