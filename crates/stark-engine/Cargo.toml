[package]
name = "stark-engine"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license = "MIT AND Apache-2.0"
build = "build/main.rs"

[lints]
workspace = true

[features]
default = ["cpu", "metal", "grammar"]

# Scoring-only features. All six are enabled by stark-score's `optimized`
# feature set and validated for bit-exact scoring parity; stark-generate is
# built without them. See docs/TECHNICAL_OVERVIEW.md#engine-feature-flags.

# Encode the zeroing of DeltaNet state into the first command buffer instead of
# one synchronous fill per layer at state creation. The flag recording the fill
# is cleared when it is encoded, so a state whose first encoding fails before
# submission must be discarded by the caller.
deferred-state-init = []

# Skip the query path of the final attention layer for prompt chunks whose
# logits are not read. Requires the per-state opt-in that only
# `score_next_token` sets; generation is unaffected even when compiled in.
scoring-last-layer-pruning = []

# With the pruning above, use a KV-only preparation kernel for the pruned final
# layer. Fires only for non-final chunks of prompts longer than one batch whose
# final layer is owned, non-ring full attention.
attention-kv-only = ["scoring-last-layer-pruning"]

cpu = [] # TODO: move libm here

# Compact convolved QKV on top of direct-delta-conv. The original gate/control
# projection is still computed because beta, alpha and gate are read from it.
compact-delta-conv = ["direct-delta-conv"]

metal = [
    "dep:rayon",
    "dep:clang-ast",
    "dep:depfile",
    "dep:tempfile",
    "dep:serde_json",
    "dep:objc2",
    "dep:obfstr",
    "dep:blake3",
    "dep:xxhash-rust",
    "dep:metal",
    "dep:stark_lily_core",
]

grammar = ["dep:xgrammar", "dep:schemars"]

# Remove padded DeltaNet convolution tokens with exact arithmetic.
direct-delta-conv = []

# Cache CPU-side RoPE tables (up to 8192 positions, 8 MiB); GPU arithmetic is
# unchanged.
rope-cache = []

[build-dependencies]
anyhow.workspace = true
walkdir.workspace = true
derive_more.workspace = true
serde.workspace = true
quote.workspace = true
proc-macro2.workspace = true
syn.workspace = true
prettyplease.workspace = true
itertools.workspace = true
rhai.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "ios", target_os = "tvos", target_os = "visionos"))'.build-dependencies]
rayon = { workspace = true, optional = true }
clang-ast = { workspace = true, optional = true }
depfile = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
serde_json = { workspace = true, features = ["unbounded_depth"], optional = true }
blake3 = { workspace = true, optional = true }
xxhash-rust = { workspace = true, features = ["xxh3"], optional = true }

[dependencies]
stark-engine-macros.workspace = true
bitflags.workspace = true
derive_more = { workspace = true, features = ["debug"] }
half.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "=0.10.9"
monostate.workspace = true
thiserror.workspace = true
tokenizers.workspace = true
rangemap.workspace = true
bytemuck = { workspace = true, features = ["derive"] }
num-traits.workspace = true
libm.workspace = true
libc.workspace = true
itertools.workspace = true
parking_lot.workspace = true
image = { version = "=0.25.10", default-features = false, features = ["png"] }
jpeg-decoder = { version = "=0.3.2", default-features = false }

[target.'cfg(any(target_os = "macos", target_os = "ios", target_os = "tvos", target_os = "visionos"))'.dependencies]
objc2 = { workspace = true, optional = true }
obfstr = { workspace = true, optional = true }
xxhash-rust = { workspace = true, features = ["xxh3"], optional = true }
metal = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
stark_lily_core = { path = "../../vendor/lily-core", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
xgrammar = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }

[dev-dependencies]
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
cxx.workspace = true
proptest.workspace = true
criterion.workspace = true
libtest-mimic.workspace = true
rand.workspace = true
rand_distr.workspace = true
is_close.workspace = true
ndarray.workspace = true
rstest.workspace = true

[target.'cfg(target_os = "ios")'.dev-dependencies]
objc2.workspace = true
objc2-foundation.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { workspace = true, default-features = true }
proptest = { workspace = true, default-features = true }

[[test]]
name = "cxx_string"
path = "tests/cxx_string.rs"
required-features = ["grammar"]
