[package]
name = "stark-score"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
license.workspace = true

[[bin]]
name = "stark-score"
path = "src/main.rs"

[[bin]]
name = "stark-score-digest"
path = "probes/score_digest.rs"

[[bin]]
name = "stark-gguf-experiment"
path = "probes/gguf_experiment.rs"

[features]
default = ["probability-scoring"]
probability-scoring = []
optimized = [
    "stark-engine/deferred-state-init",
    "stark-engine/scoring-last-layer-pruning",
    "stark-engine/direct-delta-conv",
    "stark-engine/rope-cache",
    "stark-engine/compact-delta-conv",
    "stark-engine/attention-kv-only",
]

[dependencies]
stark-engine = { path = "../stark-engine", default-features = false, features = ["metal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
sha2 = "0.10"
