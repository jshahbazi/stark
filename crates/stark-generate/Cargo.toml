[package]
name = "stark-generate"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
license.workspace = true

[features]
default = ["metal"]
metal = ["dep:stark-engine", "stark-engine/metal"]
glm-exl3 = ["metal", "stark-engine/glm-exl3"]
gemma4-assistant-staging = ["metal"]

[dependencies]
stark-resource-budget = { path = "../stark-resource-budget" }
stark-engine = { path = "../stark-engine", default-features = false, optional = true }
serde.workspace = true
serde_json.workspace = true
libc.workspace = true
rayon.workspace = true

[dev-dependencies]
sha2 = "=0.10.9"

[lints]
workspace = true
