[package]
name = "stark-napi-identity-test"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[features]
default = ["bindings-napi"]
bindings-napi = []
bindings-pyo3 = []
bindings-uniffi = []
bindings-wasm = []

[dependencies]
bindings = { path = "../.." }
napi = { version = "=3.10.3", features = ["napi10", "object_indexmap", "tokio_rt", "compat-mode"] }
napi-derive = "=3.5.9"

[build-dependencies]
napi-build = "=2.3.2"

[patch.crates-io]
napi = { path = "../../../../../vendor/napi-rs/napi-3.10.3" }
napi-derive-backend = { path = "../../../../../vendor/napi-rs/napi-derive-backend-5.1.1" }
napi-sys = { path = "../../../../../vendor/napi-rs/napi-sys-3.2.2" }
